# @package _global_

# to execute this experiment run:
# python train.py experiment=cluster_jepa_audioset_rope_1gpu

defaults:
  - override /data: audioset
  - override /model: audio_jepa
  - override /trainer: gpu
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["audioset", "jepa", "rope", "cluster", "1GPU"]

trainer:
  max_steps: 500000

data:
  batch_size: 128

logger:
  wandb:
    name: "jepa-audioset-rope-500k-128bs-1gpu"
    offline: True
    log_model: False

callbacks:
  model_checkpoint:
    save_weights_only: True
  
  wandb_offline_checkpoint:
    _target_: src.callbacks.wandb_callbacks.WandbOfflineCheckpointCallback

  rich_progress_bar: null

model:
  net:
    encoder:
      pos_embed_type: rope
    predictor:
      pos_embed_type: rope
