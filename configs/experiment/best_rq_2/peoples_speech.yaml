# @package _global_

# to execute this experiment run:
# python train.py experiment=best_rq_2/peoples_speech

defaults:
  - override /data: peoples_speech
  - override /model: best_rq2
  - override /trainer: gpu
  - override /logger: wandb

tags: ["peoples_speech", "best-rq-2", "baseline", "cluster GPU"]

trainer:
  max_steps: 200000

data:
  batch_size: 256
  num_workers: ${oc.decode:${oc.env:SLURM_CPUS_PER_TASK}}

logger:
  wandb:
    offline: True
    log_model: False

callbacks:
  rich_progress_bar: null

  wandb_offline_checkpoint:
    _target_: src.callbacks.wandb_callbacks.WandbOfflineCheckpointCallback
