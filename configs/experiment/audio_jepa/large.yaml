# @package _global_

# to execute this experiment run:
# python train.py experiment=cluster_jepa_audioset_large

defaults:
  - override /data: audioset
  - override /model: audio_jepa
  - override /trainer: gpu
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["audioset", "jepa", "large", "cluster", "1GPU"]

# ViT Large Configuration
model:
  net:
    patch_embed:
      embed_dim: 1024
    encoder:
      embed_dim: 1024
      depth: 24
      num_heads: 16

trainer:
  max_steps: 300000

data:
  batch_size: 256
  num_workers: ${oc.decode:${oc.env:SLURM_CPUS_PER_TASK}}

logger:
  wandb:
    name: "jepa-audioset-large-300k-256bs"
    offline: True
    log_model: False

callbacks:
  model_checkpoint:
    save_weights_only: True
  
  wandb_offline_checkpoint:
    _target_: src.callbacks.wandb_callbacks.WandbOfflineCheckpointCallback

  rich_progress_bar: null
