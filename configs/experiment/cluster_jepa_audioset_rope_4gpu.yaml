# @package _global_

defaults:
  - override /data: audioset
  - override /model: audio_jepa
  - override /trainer: ddp
  - override /logger: wandb
  - override /callbacks: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["audioset", "jepa", "RoPE", "cluster", "DDP", "4GPU"]

trainer:
  devices: ${oc.decode:${oc.env:SLURM_NTASKS}}
  max_steps: 200000

data:
  data_dir: ${paths.data_dir}
  train_h5: AudioSet/full_unbal_bal_train_wav.h5
  val_h5: AudioSet/eval_soxrhq.h5
  batch_size: 256
  num_workers: ${oc.decode:${oc.env:SLURM_CPUS_PER_TASK}}

logger:
  wandb:
    name: "jepa-audioset-200k-256x4bs-rope"
    offline: True
    log_model: False

callbacks:
  model_checkpoint:
    save_weights_only: True
  
  rich_progress_bar: null
  
  wandb_offline_checkpoint:
    _target_: src.callbacks.wandb_callbacks.WandbOfflineCheckpointCallback

model:
  net:
    encoder:
      pos_embed_type: rope
    predictor:
      pos_embed_type: rope
