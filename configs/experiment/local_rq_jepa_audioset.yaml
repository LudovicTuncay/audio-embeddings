# @package _global_

# to execute this experiment run:
# python train.py experiment=local_rq_jepa_audioset

defaults:
  - override /data: audioset
  - override /model: rq_jepa
  - override /trainer: gpu
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["audioset", "rq-jepa", "baseline", "local GPU"]

trainer:
  devices: 1
  max_steps: 200000

data:
  batch_size: 128
  num_workers: 16

logger:
  wandb:
    name: "local-rq-jepa-audioset-200k-128x1bs"
    offline: False
    log_model: True

callbacks:
  model_checkpoint:
    save_weights_only: True
