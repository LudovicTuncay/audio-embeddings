# @package _global_

# to execute this experiment run:
# python train.py experiment=cluster_rqa_jepa_audioset

defaults:
  - override /data: audioset
  - override /model: rqa_jepa
  - override /trainer: gpu
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["audioset", "rqa-jepa", "baseline", "cluster GPU"]

trainer:
  devices: 4
  num_nodes: 1
  max_steps: 200000
  strategy: ddp

data:
  batch_size: 96
  num_workers: 16

logger:
  wandb:
    name: "cluster-rqa-jepa-audioset-200k-128bs"
    offline: False
    log_model: True

callbacks:
  model_checkpoint:
    save_weights_only: True

  rich_progress_bar: null
