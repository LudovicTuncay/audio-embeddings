_target_: src.models.best_rq2_module.BestRQ2Module

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.05

warmup_pct: 0.05

ema:
  enabled: false
  decay: null
  decay_numerator: 20.0 # decay rate is 1 - decay_numerator / ( total_steps - warmup_steps )
  update_every_n_steps: 1
  use_buffers: true

spectrogram_adjustment_mode: truncate

criterion:
  _target_: torch.nn.CrossEntropyLoss
  _partial_: true
  reduction: mean

codebook_dim: 16
vocab_size: 8192

net:
  spectrogram:
    sample_rate: ${data.target_sample_rate}
    n_fft: 2048
    win_length_ms: 128
    hop_length_ms: 39.0625
    n_mels: 128
    f_min: 0
    f_max: 8000
    power: 2.0

  patch_embed:
    img_size: [128, 256]
    patch_size: [16, 16]
    in_chans: 1
    embed_dim: 768

  masking:
    input_size: [128, 256]
    patch_size: [16, 16]
    mask_ratio: [0.4, 0.6]

  encoder:
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    qkv_bias: true
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    num_patches: 128
    pos_embed_type: "sincos"

  predictor:
    embed_dim: 768
    depth: 4
    num_heads: 12
    mlp_ratio: 4.0
    qkv_bias: true
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
    num_patches: 128
    pos_embed_type: "sincos"
